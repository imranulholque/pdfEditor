<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&family=Noto+Serif+Bengali:wght@400;700&family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#f1f3f6;--bar:#fff;--tx:#1d2330;--ac:#2563eb;--bd:#d9dee7}
@media(prefers-color-scheme:dark){:root{--bg:#171a21;--bar:#232833;--tx:#e8ebf1;--bd:#363d4b}}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:50;background:var(--bar);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
header b{font-size:16px;margin-right:6px}
button,select,input[type=number]{font:inherit;color:var(--tx);background:var(--bar);border:1px solid var(--bd);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.pri{background:#16a34a;color:#fff;border-color:#16a34a;margin-left:auto}
input[type=color]{width:34px;height:32px;padding:2px;border:1px solid var(--bd);border-radius:7px;background:var(--bar)}
input[type=number]{width:64px;cursor:text}
.sep{width:1px;height:24px;background:var(--bd);margin:0 4px}
#bgbox{display:none;align-items:center;gap:6px;padding:2px 8px;border:1px dashed var(--bd);border-radius:8px}
#hint{text-align:center;padding:10px;font-size:13px;opacity:.75}
#doc{padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
#empty{margin:60px auto;padding:50px 30px;border:2px dashed var(--bd);border-radius:16px;text-align:center;max-width:460px}
.pg{position:relative;background:#fff;box-shadow:0 2px 12px #0003;flex:none}
.pg canvas{display:block}
.ov{position:absolute;inset:0;overflow:hidden}
.ti{position:absolute;white-space:pre;line-height:1.2;padding:0;margin:0;outline:none;color:transparent;caret-color:#06f;z-index:2;cursor:text}
.ti:hover{outline:1px dashed #2563eb88}
.ti.sel{outline:1px solid var(--ac)}
.cv{position:absolute;z-index:1}
.ob{position:absolute;z-index:3;cursor:move;touch-action:none}
.ob img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.ob.sel{outline:2px solid var(--ac)}
.rs{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;background:var(--ac);border-radius:3px;cursor:nwse-resize;display:none}
.ob.sel .rs{display:block}
#grip{position:absolute;z-index:9;width:16px;height:16px;background:var(--ac);color:#fff;border-radius:4px;font-size:11px;line-height:16px;text-align:center;cursor:move;display:none;touch-action:none}
.rb{position:absolute;border:1.5px dashed #e11d48;background:#e11d4818;z-index:8}
body.cut .ti,body.cut .ob{pointer-events:none}
body.cut .ov,body.text .ov{cursor:crosshair}
</style></head><body>
<header>
<b>PDF Editor</b>
<button id="open">Open PDF</button><input type="file" id="f" accept="application/pdf,.pdf" hidden>
<span class="sep"></span>
<button data-t="edit" class="on" title="Click any text to edit it">Edit text</button>
<button data-t="text" title="Click anywhere to add new text / fill forms">Add text</button>
<button data-t="cut" title="Drag a box around a logo, seal or stamp to make it movable">Move logo/stamp</button>
<button id="img">Add image / signature</button><input type="file" id="fi" accept="image/*" hidden>
<span class="sep"></span>
<select id="ff"></select>
<input type="number" id="fz" min="3" max="300" step="0.5" title="Size (pt)">
<button id="b"><b>B</b></button><button id="i"><i>I</i></button>
<input type="color" id="col" title="Text colour">
<button id="del">Delete</button>
<span id="bgbox">Remove BG:
<input type="color" id="bgc" title="Background colour to remove">
<input type="range" id="tol" min="5" max="150" value="45" title="Strength">
<button id="rm">Remove</button><button id="rs">Restore</button></span>
<button id="save" class="pri">Save PDF</button>
</header>
<div id="hint">Edit text: click it and type · Move text: drag the blue grip · Delete: select all text and press Delete</div>
<main id="doc"><div id="empty"><h2>Open a PDF to start</h2><p>Click “Open PDF” or drop a file here.<br>Works with English and বাংলা (Avro, Bijoy, any keyboard).</p></div></main>
<div id="grip" title="Drag to move">✥</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const SC=1.5,$=s=>document.querySelector(s),grip=$('#grip');
let bytes,tool='edit',sel=null,cur=null,name='edited.pdf';
const FONTS=['Arial','Helvetica','Times New Roman','Courier New','Georgia','Verdana','Calibri','Tahoma','Noto Sans Bengali','Noto Serif Bengali','Hind Siliguri','SutonnyMJ','Kalpurush','SolaimanLipi','Nikosh'];
FONTS.forEach(f=>$('#ff').add(new Option(f,f)));
const hx=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mk=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const cvs=(w,h)=>{const c=mk('canvas');c.width=w;c.height=h;return c};
const loadImg=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});

function px(c,x,y){x=Math.max(0,Math.min(c.width-1,x|0));y=Math.max(0,Math.min(c.height-1,y|0));const d=c.getContext('2d').getImageData(x,y,1,1).data;return hx(d[0],d[1],d[2])}
function ink(c,x,y,w,h){x=Math.max(0,x|0);y=Math.max(0,y|0);w=Math.max(1,Math.min(w|0,c.width-x));h=Math.max(1,Math.min(h|0,c.height-y));
 const d=c.getContext('2d').getImageData(x,y,w,h).data;let b=999,r=0,g=0,l=0;
 for(let i=0;i<d.length;i+=4){const s=d[i]+d[i+1]+d[i+2];if(s<b){b=s;r=d[i];g=d[i+1];l=d[i+2]}}return hx(r,g,l)}

/* ---------- open & render ---------- */
$('#open').onclick=()=>$('#f').click();
$('#f').onchange=e=>e.target.files[0]&&openFile(e.target.files[0]);
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];f&&/pdf/i.test(f.type+f.name)&&openFile(f)});
async function openFile(f){
 name=f.name.replace(/\.pdf$/i,'')+'-edited.pdf';
 bytes=new Uint8Array(await f.arrayBuffer());
 $('#doc').innerHTML='<p>Loading…</p>';select(null);
 try{const pdf=await pdfjsLib.getDocument({data:bytes.slice()}).promise;$('#doc').innerHTML='';
  for(let n=1;n<=pdf.numPages;n++)await renderPage(pdf,n);
 }catch(err){$('#doc').innerHTML='<p>Could not open this PDF: '+err.message+'</p>'}
}
async function renderPage(pdf,n){
 const pg=await pdf.getPage(n),vp=pg.getViewport({scale:SC});
 const w=mk('div','pg');w.style.width=vp.width+'px';w.style.height=vp.height+'px';
 const c=cvs(vp.width,vp.height);
 await pg.render({canvasContext:c.getContext('2d',{willReadFrequently:true}),viewport:vp}).promise;
 const ov=mk('div','ov');w.append(c,ov);$('#doc').append(w);
 w._c=c;w._n=n;w._ov=ov;cur=cur||w;
 w.addEventListener('pointerdown',()=>cur=w,true);
 const tc=await pg.getTextContent();
 for(const it of tc.items){
  if(!it.str.trim())continue;
  const t=pdfjsLib.Util.transform(vp.transform,it.transform),fs=Math.hypot(t[0],t[1])||10,st=tc.styles[it.fontName]||{};
  let fn='';try{fn=pg.commonObjs.get(it.fontName).name||''}catch(e){}
  fn=fn.replace(/^[A-Z]{6}\+/,'');
  const fam=(fn.split(/[-,]/)[0]||'').replace(/(MT|PS)$/,'').replace(/([a-z])([A-Z])/g,'$1 $2');
  const x=t[4],y=t[5]-fs*.94,cw=Math.max(it.width*SC,4),ch=fs*1.2;
  const e=mkTi(ov,{x,y,fs,txt:it.str,
   fam:`"${fam}","${fn}",${st.fontFamily||'sans-serif'},"Noto Sans Bengali"`,
   b:/bold|black|heavy/i.test(fn),i:/italic|oblique/i.test(fn)});
  Object.assign(e.dataset,{ox:x,oy:y,cw,ch,col:ink(c,x,y,cw,ch),bg:px(c,x>4?x-3:x+cw+3,y+ch/2)});
  e.style.minWidth=cw+'px';
 }
 fit(ov);
}
function fit(ov){
 const els=[...ov.querySelectorAll('.ti')],ws=els.map(e=>{const r=document.createRange();r.selectNodeContents(e);return r.getBoundingClientRect().width});
 els.forEach((e,i)=>{const n=e.textContent.length,d=+e.dataset.cw-ws[i];if(n&&Math.abs(d)>.5)e.style.letterSpacing=(d/n)+'px'});
}
function mkTi(ov,o){
 const e=mk('div','ti');e.contentEditable='true';e.spellcheck=false;e.textContent=o.txt;
 e.style.cssText=`left:${o.x}px;top:${o.y}px;font-size:${o.fs}px;font-family:${o.fam};font-weight:${o.b?700:400};font-style:${o.i?'italic':'normal'}`;
 ov.append(e);
 e.addEventListener('focus',()=>select(e));
 e.addEventListener('pointerdown',ev=>{cur=ov.parentNode;select(e)});
 e.addEventListener('input',()=>mark(e));
 e.addEventListener('paste',ev=>{ev.preventDefault();document.execCommand('insertText',false,ev.clipboardData.getData('text/plain'))});
 e.addEventListener('keydown',ev=>{if(ev.key==='Escape')e.blur()});
 return e;
}
function mark(e){e.dataset.ed=1;e.style.color=e.dataset.col||'#000';e.style.background=e.dataset.bg||'transparent'}

/* ---------- selection & toolbar ---------- */
function select(el){
 sel&&sel.classList.remove('sel');sel=el;grip.style.display='none';$('#bgbox').style.display='none';
 if(!el)return;el.classList.add('sel');
 if(el.classList.contains('ti')){
  const f=(el.style.fontFamily.match(/"([^"]+)"/)||[])[1]||'Arial';
  if(![...$('#ff').options].some(o=>o.value===f))$('#ff').add(new Option(f,f));
  $('#ff').value=f;$('#fz').value=Math.round(parseFloat(el.style.fontSize)/SC*2)/2;
  $('#col').value=el.dataset.col||'#000000';
  el.parentNode.append(grip);placeGrip();
 }else{
  $('#bgbox').style.display='flex';if(el.dataset.bg)$('#bgc').value=el.dataset.bg;
 }
}
function placeGrip(){if(sel&&sel.classList.contains('ti')){grip.style.display='block';grip.style.left=sel.offsetLeft-18+'px';grip.style.top=sel.offsetTop+'px'}}
grip.onpointerdown=e=>{if(sel){mark(sel);drag(e,sel,placeGrip)}};
function drag(e,el,fn){e.preventDefault();const sx=e.clientX,sy=e.clientY,l=el.offsetLeft,t=el.offsetTop;
 const mv=v=>{el.style.left=l+v.clientX-sx+'px';el.style.top=t+v.clientY-sy+'px';fn&&fn()};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
 addEventListener('pointermove',mv);addEventListener('pointerup',up)}
const isTi=()=>sel&&sel.classList.contains('ti');
$('#ff').onchange=e=>{if(isTi()){sel.style.letterSpacing='';sel.style.fontFamily=`"${e.target.value}",sans-serif,"Noto Sans Bengali"`;mark(sel)}};
$('#fz').oninput=e=>{if(isTi()&&+e.target.value>0){sel.style.letterSpacing='';sel.style.fontSize=e.target.value*SC+'px';mark(sel)}};
$('#b').onclick=()=>{if(isTi()){sel.style.fontWeight=sel.style.fontWeight==='700'?'400':'700';mark(sel)}};
$('#i').onclick=()=>{if(isTi()){sel.style.fontStyle=sel.style.fontStyle==='italic'?'normal':'italic';mark(sel)}};
$('#col').oninput=e=>{if(isTi()){sel.dataset.col=e.target.value;mark(sel)}};
$('#del').onclick=delSel;
function delSel(){if(!sel)return;
 if(sel.classList.contains('ob')){sel.remove();select(null)}
 else if(sel.classList.contains('nw'))sel.remove(),select(null);
 else{sel.textContent='';mark(sel)}}
addEventListener('keydown',e=>{if(e.key==='Delete'&&sel&&sel.classList.contains('ob'))delSel()});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
 tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));
 document.body.className=tool==='edit'?'':tool});

/* ---------- page clicks: add text / cut region ---------- */
document.addEventListener('pointerdown',e=>{
 const ov=e.target.closest&&e.target.closest('.ov');
 if(!ov){if(!e.target.closest('header')&&!e.target.closest('#grip'))select(null);return}
 if(e.target!==ov)return;
 const w=ov.parentNode;cur=w;select(null);
 const r=ov.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(tool==='text'){
  e.preventDefault();
  const t=mkTi(ov,{x,y:y-9,fs:12*SC,fam:'"Arial",sans-serif',txt:''});
  t.classList.add('nw');t.dataset.col='#000000';t.style.color='#000';t.style.minWidth='30px';t.dataset.ed=1;t.focus();
 }else if(tool==='cut'){
  e.preventDefault();const rb=mk('div','rb');ov.append(rb);let X=x,Y=y,W=0,H=0;
  const mv=v=>{const a=v.clientX-r.left,b=v.clientY-r.top;X=Math.min(x,a);Y=Math.min(y,b);W=Math.abs(a-x);H=Math.abs(b-y);
   Object.assign(rb.style,{left:X+'px',top:Y+'px',width:W+'px',height:H+'px'})};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);rb.remove();
   if(W>6&&H>6)cutRegion(w,X,Y,W,H)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
 }
});
function cutRegion(w,x,y,ww,hh){
 const c=w._c,t=cvs(ww,hh);t.getContext('2d').drawImage(c,x,y,ww,hh,0,0,ww,hh);
 const bg=px(c,x>4?x-3:x+ww+3,y+hh/2),cv=mk('div','cv');
 cv.style.cssText=`left:${x}px;top:${y}px;width:${ww}px;height:${hh}px;background:${bg}`;
 Object.assign(cv.dataset,{ox:x,oy:y,cw:ww,ch:hh,bg});w._ov.append(cv);
 mkOb(w._ov,t.toDataURL(),x,y,ww,hh);
 document.querySelector('[data-t=edit]').click();
}

/* ---------- images & signature ---------- */
$('#img').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 const u=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
 const i=await loadImg(u),k=Math.min(1,1600/Math.max(i.width,i.height)),c=cvs(i.width*k,i.height*k);
 c.getContext('2d').drawImage(i,0,0,c.width,c.height);
 const w=cur||document.querySelector('.pg');if(!w)return alert('Open a PDF first');
 const dw=Math.min(220,c.width);mkOb(w._ov,c.toDataURL(),60,60,dw,dw*c.height/c.width);
};
async function mkOb(ov,url,x,y,w,h){
 const o=mk('div','ob'),im=new Image(),rs=mk('i','rs');
 o.dataset.orig=o.dataset.cur=url;im.src=url;im.draggable=false;o.append(im,rs);
 o.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
 o.addEventListener('pointerdown',e=>{cur=ov.parentNode;select(o);
  if(e.target!==rs)return drag(e,o);
  e.preventDefault();e.stopPropagation();const sx=e.clientX,w0=o.offsetWidth,h0=o.offsetHeight;
  const mv=v=>{const nw=Math.max(16,w0+v.clientX-sx);o.style.width=nw+'px';o.style.height=nw*h0/w0+'px'};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up)});
 ov.append(o);select(o);
 const i=await loadImg(url),c=cvs(i.width,i.height),g=c.getContext('2d');g.drawImage(i,0,0);
 const p=[[0,0],[i.width-1,0],[0,i.height-1],[i.width-1,i.height-1]].map(q=>g.getImageData(q[0],q[1],1,1).data);
 o.dataset.bg=hx(...[0,1,2].map(k=>p.reduce((s,d)=>s+d[k],0)/4));
 if(sel===o)$('#bgc').value=o.dataset.bg;
}
$('#rm').onclick=async()=>{
 if(!sel||!sel.classList.contains('ob'))return;
 const [R,G,B]=rgb($('#bgc').value),tol=+$('#tol').value;
 const i=await loadImg(sel.dataset.orig),c=cvs(i.width,i.height),g=c.getContext('2d');g.drawImage(i,0,0);
 const d=g.getImageData(0,0,c.width,c.height),p=d.data;
 for(let k=0;k<p.length;k+=4){const dist=Math.hypot(p[k]-R,p[k+1]-G,p[k+2]-B);
  const a=dist<=tol?0:dist>=tol*1.5?255:(dist-tol)/(tol*.5)*255;p[k+3]=Math.min(p[k+3],a)}
 g.putImageData(d,0,0);sel.dataset.cur=c.toDataURL();sel.querySelector('img').src=sel.dataset.cur;
};
$('#rs').onclick=()=>{if(sel&&sel.classList.contains('ob')){sel.dataset.cur=sel.dataset.orig;sel.querySelector('img').src=sel.dataset.orig}};

/* ---------- save ---------- */
async function textPng(e){
 const cs=getComputedStyle(e),fs=parseFloat(cs.fontSize),S=3,L=e.innerText.replace(/\n$/,'').split('\n');
 const font=`${cs.fontStyle} ${cs.fontWeight} ${fs*S}px ${cs.fontFamily}`;
 try{await document.fonts.load(font,e.innerText)}catch(x){}
 const ls=cs.letterSpacing==='normal'?'0px':parseFloat(cs.letterSpacing)*S+'px',m=cvs(10,10).getContext('2d');m.font=font;m.letterSpacing=ls;
 const W=Math.ceil(Math.max(...L.map(s=>m.measureText(s).width))+6),H=Math.ceil((L.length*1.2+.3)*fs*S);
 const c=cvs(W,H),g=c.getContext('2d');g.font=font;g.letterSpacing=ls;g.fillStyle=e.dataset.col||'#000';
 L.forEach((s,i)=>g.fillText(s,0,(i*1.2+.94)*fs*S));
 return {url:c.toDataURL(),w:W/S,h:H/S};
}
const buf=async u=>(await fetch(u)).arrayBuffer();
$('#save').onclick=async()=>{
 if(!bytes)return alert('Open a PDF first');
 const btn=$('#save');btn.textContent='Saving…';
 try{
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true}),P=doc.getPages(),k=1/SC;
  for(const w of document.querySelectorAll('.pg')){
   const pg=P[w._n-1],H=pg.getHeight();
   for(const e of w._ov.children){
    const d=e.dataset;
    if(e.classList.contains('cv')||(e.classList.contains('ti')&&d.ed&&d.cw)){
     const [r,g,b]=rgb(d.bg);
     pg.drawRectangle({x:(+d.ox-1)*k,y:H-(+d.oy+ +d.ch+1)*k,width:(+d.cw+2)*k,height:(+d.ch+2)*k,color:PDFLib.rgb(r/255,g/255,b/255),borderWidth:0});
    }
   }
   for(const e of w._ov.children){
    if(e.classList.contains('ti')&&e.dataset.ed&&e.innerText.trim()){
     const t=await textPng(e),im=await doc.embedPng(await buf(t.url));
     pg.drawImage(im,{x:e.offsetLeft*k,y:H-(e.offsetTop+t.h)*k,width:t.w*k,height:t.h*k});
    }else if(e.classList.contains('ob')){
     const im=await doc.embedPng(await buf(e.dataset.cur));
     pg.drawImage(im,{x:e.offsetLeft*k,y:H-(e.offsetTop+e.offsetHeight)*k,width:e.offsetWidth*k,height:e.offsetHeight*k});
    }
   }
  }
  const blob=new Blob([await doc.save()],{type:'application/pdf'}),a=mk('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
 }catch(err){alert('Save failed: '+err.message)}
 btn.textContent='Save PDF';
};
</script></body></html>
